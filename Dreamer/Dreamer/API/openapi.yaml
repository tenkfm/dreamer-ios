components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token, 15 minutes
    revenuecatWebhook:
      type: apiKey
      in: header
      name: Authorization
      description: The value configured in RevenueCat for the webhook
    kieCallback:
      type: apiKey
      in: query
      name: secret
      description: KIE_CALLBACK_SECRET
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ApiErrorCode'
            message:
              type: string
            details:
              type: object
              propertyNames:
                type: string
              additionalProperties: {}
          required:
          - code
          - message
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    ApiErrorCode:
      type: string
      enum:
      - VALIDATION_FAILED
      - AUTH_REQUIRED
      - AUTH_INVALID_TOKEN
      - AUTH_LINK_EXPIRED
      - PREMIUM_REQUIRED
      - RATE_LIMITED
      - ATTESTATION_REQUIRED
      - NOT_FOUND
      - CONFLICT
      - DREAM_FAILED
      - TTS_UNAVAILABLE
      - PROVIDER_UNAVAILABLE
      - LIMIT_REACHED
      - INTERNAL_ERROR
    AppleSignIn:
      type: object
      properties:
        identityToken:
          type: string
          minLength: 20
        authorizationCode:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
        fullName:
          type: object
          properties:
            givenName:
              type:
              - string
              - 'null'
            familyName:
              type:
              - string
              - 'null'
      required:
      - identityToken
    AttestChallenge:
      type: object
      properties:
        challenge:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - challenge
      - expiresAt
      additionalProperties: false
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            isNew:
              type: boolean
          required:
          - id
          - isNew
          additionalProperties: false
      required:
      - accessToken
      - accessExpiresAt
      - refreshToken
      - refreshExpiresAt
      - user
      additionalProperties: false
    CreateDream:
      type: object
      properties:
        clientId:
          type: string
          minLength: 8
          maxLength: 64
        text:
          type: string
          minLength: 3
          maxLength: 6000
        details:
          type: object
          properties:
            emotions:
              maxItems: 5
              type: array
              items:
                $ref: '#/components/schemas/Emotion'
            recurrence:
              $ref: '#/components/schemas/Recurrence'
            someoneSpecific:
              type: boolean
          required:
          - emotions
          - recurrence
          - someoneSpecific
        recordedAt:
          type: string
          format: date-time
        recordingId:
          type: string
          format: uuid
      required:
      - clientId
      - text
    DataExport:
      type: object
      properties:
        format:
          type: string
          const: dreamer-export-v1
        exportedAt:
          type: string
          format: date-time
        account:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type:
              - string
              - 'null'
            createdAt:
              type: string
              format: date-time
            signInMethods:
              type: array
              items:
                type: string
                enum:
                - apple
                - email
            paywallVariant:
              type:
              - string
              - 'null'
            freeInterpretationsUsed:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          required:
          - id
          - email
          - createdAt
          - signInMethods
          - paywallVariant
          - freeInterpretationsUsed
          additionalProperties: false
        profile:
          $ref: '#/components/schemas/Profile'
        subscription:
          type: object
          properties:
            status:
              $ref: '#/components/schemas/SubscriptionStatus'
            plan:
              $ref: '#/components/schemas/PlanId'
            store:
              $ref: '#/components/schemas/Store'
            expiresAt:
              type: string
              format: date-time
            willRenew:
              type: boolean
          required:
          - status
          - willRenew
          additionalProperties: false
        devices:
          type: array
          items:
            type: object
            properties:
              platform:
                type: string
              environment:
                type: string
              tokenEnding:
                type: string
              registeredAt:
                type: string
                format: date-time
              lastSeenAt:
                type: string
                format: date-time
            required:
            - platform
            - environment
            - tokenEnding
            - registeredAt
            - lastSeenAt
            additionalProperties: false
        dreams:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              createdAt:
                type: string
                format: date-time
              recordedAt:
                type: string
                format: date-time
              title:
                type:
                - string
                - 'null'
