  /v1/dreams/{id}/events:
    get:
      operationId: dreamEvents
      tags:
      - Dreams
      summary: Live progress of the interpretation (Server-Sent Events)
      description: 'The first event is a snapshot of the current state (`step`, or at once `ready`/`error` for a finished
        dream), so reconnecting never loses anything. Then: `step` {analysisStep}, `text` {lens, delta} (main lens as it is
        written; `reset: true` means drop what was shown - the provider restarted), `ready` {dream}, `error` {code, message}.
        Comment lines (`: keep-alive`) every 15 s. The stream ends after `ready`/`error` or after 120 s; if it drops or ends
        early, poll /status every 2 s.'
