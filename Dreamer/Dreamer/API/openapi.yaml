  /v1/webhooks/revenuecat:
    post:
      operationId: revenuecatWebhook
      tags:
      - Webhooks
      summary: RevenueCat subscription events
      description: 'Authorized by the shared Authorization header configured in RevenueCat (REVENUECAT_WEBHOOK_AUTH). Idempotent
        by event id: a redelivery answers `duplicate` and changes nothing; an event older than the last applied one answers
        `stale`. Unknown types and users are journaled and answered 200, so RevenueCat does not retry them.'
      security:
      - revenuecatWebhook: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevenueCatWebhook'
            example:
              api_version: '1.0'
              event:
                id: CD489E0E-5D52-4E0D-9D2F-3B0E7F9A6C11
                type: INITIAL_PURCHASE
                app_user_id: 7d0f3c2a-5b1e-4c8d-9a6f-2e4b8c1d3f5a
                original_app_user_id: 7d0f3c2a-5b1e-4c8d-9a6f-2e4b8c1d3f5a
                product_id: dreamer.yearly
                entitlement_ids:
                - premium
                period_type: TRIAL
                purchased_at_ms: 1778569920000
                expiration_at_ms: 1779174720000
                event_timestamp_ms: 1778569921000
                store: APP_STORE
                environment: SANDBOX
      responses:
        '200':
          description: Accepted (also duplicates, stale and ignored events)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueCatWebhookResult'
              example:
                outcome: applied
        '400':
          description: 'Error: VALIDATION_FAILED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: VALIDATION_FAILED
                  message: See the code
        '401':
          description: 'Error: AUTH_REQUIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: AUTH_REQUIRED
                  message: See the code
        '429':
          description: 'Error: RATE_LIMITED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: RATE_LIMITED
                  message: See the code
        '500':
          description: 'Error: INTERNAL_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: See the code
  /v1/webhooks/kie:
    post:
      operationId: kieCallback
      tags:
      - Webhooks
      summary: kie.ai task callbacks (images, voice)
      description: 'Called by kie.ai when a task ends; the secret is in the query (added to KIE_CALLBACK_URL by the API).
        Only `data.taskId` is read - the result is fetched from kie.ai, never taken from the body. A repeated callback changes
        nothing; an unknown task answers `accepted: false`.'
      security:
      - kieCallback: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KieCallback'
            example:
              code: 200
              msg: Playground task completed successfully.
              data:
                taskId: e989621f54392584b05867f87b160672
                state: success
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KieCallbackResult'
              example:
                accepted: true
