  /v1/dreams:
    post:
      operationId: createDream
      tags:
      - Dreams
      summary: Tell a dream - starts the interpretation
      description: 'Idempotent by `clientId`: a retried request returns the dream already created (200) instead of creating
        another (201). Follow progress with /events or /status. Needs premium, or a free interpretation left (paywall variant
        `oneFree`): otherwise 402 PREMIUM_REQUIRED with `{ paywallVariant, freeInterpretationsLeft: 0 }`. At most `AI_LIMIT_INTERPRETATIONS_PER_DAY`
        new dreams per local day (default 10): over it, 429 RATE_LIMITED with `RateLimitDetails` (limit, max, resetAt); a
        replay never counts.'
      security:
      - bearer: []
      parameters:
      - name: X-App-Attest-Key-Id
        in: header
        required: false
        description: The App Attest key registered with POST /v1/attest/keys.
        schema:
          type: string
      - name: X-App-Attest-Assertion
        in: header
        required: false
        description: base64 of generateAssertion(keyId, SHA256("<METHOD> <path with query>\n" + the exact body bytes)) (BE-10.3).
          Checked and logged now; once enforced, missing or invalid -> 403 ATTESTATION_REQUIRED.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDream'
            example:
              clientId: b1f0c6e2-5d8a-4b7e-9c3f-2a1e0d9c8b7a
              text: I was back in my grandmother’s house, but the hallway kept getting longer. Every door opened onto another
                staircase going down, and someone was calling my name from below.
              details:
                emotions:
                - anxiety
                - confusion
                recurrence: sometimes
                someoneSpecific: true
      responses:
        '200':
          description: Already created with this clientId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DreamDetail'
              example:
                id: 0b7e9d3c-1a2f-4c5d-8e6f-7a8b9c0d1e2f
                clientId: b1f0c6e2-5d8a-4b7e-9c3f-2a1e0d9c8b7a
                createdAt: 2026-09-24 11:12:00+00:00
                recordedAt: 2026-09-24 11:10:00+00:00
                title: The house with endless stairs
                text: I was back in my grandmother’s house, but the hallway kept getting longer. Every door opened onto another
                  staircase going down, and someone was calling my name from below.
                emotions:
                - anxiety
                - confusion
                recurrence: sometimes
                someoneSpecific: true
                status: ready
                analysisStep: 4
                errorCode: null
                mainLens: psychology
                interpretation:
                  lenses:
                    psychology: Endless stairs in a familiar house often appear when you are working through something slowly,
                      one step at a time, without seeing where it ends. Your grandmother’s house points to roots and safety.
                      The voice calling from below is a part of you asking for attention - a feeling or a decision you keep
                      postponing.
                    spiritual: 'Going down stairs is a classic image of a journey inward, toward memory and intuition. A house
                      that keeps growing suggests your inner world is larger than you let yourself explore. The calling voice
                      is often read as guidance: something from your past holds wisdom for your present.'
                    dreamBook: 'Stairs going down: a time of reflection before a change. An old family house: news from family,
                      or a return to an old question. Hearing your name called: an important message is near, so listen to
                      the people close to you this week.'
                  forYou: You mentioned stress at work. Dreams like this often come when a decision feels unfinished. What
                    is the one step you keep putting off?
                  symbols:
                  - name: Staircase down
                    meaning: Progress you can’t see yet
                    icon: stairs
                    keyword: stairs
                  - name: Grandmother’s house
                    meaning: Roots and safety
                    icon: house
                    keyword: house
                  - name: A voice calling
                    meaning: A part of you asking for attention
                    icon: person
                    keyword: voice
                  safetyFlag: false
                image:
                  status: ready
                  url: https://media.example.com/dreams/0b7e9d3c-1a2f-4c5d-8e6f-7a8b9c0d1e2f/image-v1.webp
                  previewUrl: https://media.example.com/dreams/0b7e9d3c-1a2f-4c5d-8e6f-7a8b9c0d1e2f/image-v1-540.webp
                  thumbnailUrl: https://media.example.com/dreams/0b7e9d3c-1a2f-4c5d-8e6f-7a8b9c0d1e2f/image-v1-270.webp
