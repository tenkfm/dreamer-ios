# Normalized copy of the Dreamer API contract 1.0.0 (dreamer-platform openapi.yaml).
# Written by scripts/sync-openapi.sh - do not edit. Only change: nullable `anyOf [X, null]`
# values became optional `X` (see scripts/normalize_openapi.py).
openapi: 3.1.0
info:
  title: Dreamer API
  version: 1.0.0
  description: 'API of the Dreamer iOS app (phase 1, app2app). Generated from the zod schemas in packages/shared - do not
    edit by hand; run `pnpm contract`.


    Errors always have the shape `{ "error": { "code", "message", "details" } }`; branch on `code`.

    `RATE_LIMITED` (429) comes with a `Retry-After` header and `RateLimitDetails`; a daily AI limit (N interpretations a day)
    names the `limit` and its `resetAt`.

    Breaking changes go to `/v2` only. `info.version` is the contract version (semver): minor for additions, patch for descriptions.

    The guide - auth, pagination, the event stream, idempotency, limits, webhooks: docs/api.md.'
servers:
- url: https://{host}
  description: Production or staging
  variables:
    host:
      default: api.example.com
      description: api.<domain> or staging-api.<domain>
- url: http://localhost:3100
  description: Local API (pnpm dev:api)
- url: http://localhost:4010
  description: Mock server on these examples (pnpm mock:api)
tags:
- name: System
  description: Liveness for probes and the deploy script
- name: Auth
  description: Sign in with Apple or an email link; JWT access (15 min) + rotating refresh (60 days)
- name: Profile
  description: Quiz answers, lens, reminders; account deletion and data export
- name: Dreams
  description: Telling a dream, its interpretation, the journal
- name: Audio
  description: Voice-over of the interpretation (ElevenLabs through the API)
- name: Recordings
  description: Server-side speech-to-text fallback
- name: Insights
  description: Patterns for Home and Journal
- name: Library
  description: The dream-symbol library
- name: Subscription
  description: Premium status
- name: Devices
  description: APNs tokens
- name: Webhooks
  description: Called by RevenueCat and kie.ai, not by the app
paths:
  /health:
    get:
      operationId: health
      tags:
      - System
      summary: Status of the API, the database and Redis
      security: []
      responses:
        '200':
          description: Everything is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: 0.1.0
                uptimeSec: 3600
                services:
                  database: up
                  redis: up
        '500':
          description: 'Error: INTERNAL_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: See the code
        '503':
          description: A dependency is down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: degraded
                version: 0.1.0
                uptimeSec: 3600
                services:
                  database: down
                  redis: up
