class Component extends DCLogic {
  constructor(props) { super(props); this.state = {a: true, b: true, c: false}; }
  renderVals() {
    const st = this.state;
    const font = this.props.font || "Quicksand";
    const W = {Thin: [300, 300, 400, 500], Light: [300, 400, 500, 500], Regular: [400, 500, 600, 600]}[this.props.weight || "Light"];
    const serif = (this.props.logo || "Serif italic") === "Serif italic";
    const fontVars = 'font-family: "' + font + '", system-ui, sans-serif; --wh: ' + W[0] + '; --wm: ' + W[1] + '; --wb: ' + W[2] + '; --wl: ' + (serif ? 600 : W[3]) +

    return { fontVars: fontVars, yes: true, no: false,
      ...(() => {
        const sw = (on) => "position: relative; width: 50px; height: 30px; flex-shrink: 0; border: none; border-radius: 999px; cursor: pointer; padding: 0; transition: background .3s; background: " + (on ? "#2E4677" : "rgba(90, 110, 150, 0.3)");
        const kn = (on) => "position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2); transition: transform .35s cubic-bezier(.3,.7,.4,1.3); transform: translateX(" + (on ? "20px" : "0") + ")";
        return { sA: sw(st.a), kA: kn(st.a), oA: st.a ? "true" : "false", tA: () => this.setState({a: !st.a}),
                 sB: sw(st.b), kB: kn(st.b), oB: st.b ? "true" : "false", tB: () => this.setState({b: !st.b}),
                 sC: sw(st.c), kC: kn(st.c), oC: st.c ? "true" : "false", tC: () => this.setState({c: !st.c}) };
      })(),
    };
  }
}
