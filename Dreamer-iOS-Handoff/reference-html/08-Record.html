<script type="text/x-dc" data-dc-script data-props='{"font":{"editor":"enum","options":["Quicksand","Nunito","M PLUS Rounded 1c","Comfortaa","Outfit","Urbanist"],"default":"Quicksand","section":"Type"},"weight":{"editor":"enum","options":["Thin","Light","Regular"],"default":"Light","section":"Type"},"logo":{"editor":"enum","options":["Serif italic","Rounded"],"default":"Serif italic","section":"Type"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = {n: 0}; }
  componentDidMount() { this.t = setInterval(() => { if (this.state.n < 171) this.setState({n: this.state.n + 2}); }, 80); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const st = this.state;
    const font = this.props.font || "Quicksand";
    const W = {Thin: [300, 300, 400, 500], Light: [300, 400, 500, 500], Regular: [400, 500, 600, 600]}[this.props.weight || "Light"];
    const serif = (this.props.logo || "Serif italic") === "Serif italic";
    const fontVars = 'font-family: "' + font + '", system-ui, sans-serif; --wh: ' + W[0] + '; --wm: ' + W[1] + '; --wb: ' + W[2] + '; --wl: ' + (serif ? 600 : W[3]) +
      '; --logoFamily: ' + (serif ? '"Cormorant Garamond", Georgia, serif' : '"' + font + '", system-ui, sans-serif') + '; --logoStyle: ' + (serif ? 'italic' : 'normal') + '; --logoTrack: ' + (serif ? '0' : '-0.5px');
    return { fontVars: fontVars, yes: true, no: false,

    };
  }
}
